name: card_due
description: "A premium Credit Card Bill Reminder Progressive Web App (PWA)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management (MVVM ViewModels)
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.1

  # Local NoSQL Database (IndexedDB on Web)
  sembast: 3.8.7
  sembast_web: ^2.0.0

  # Data Modeling & Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # UI/UX & Responsive Layout
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  intl: ^0.19.0
  path: ^1.9.0
  path_provider: ^2.1.3
  file_picker: ^8.0.7
  uuid: ^4.3.3
  web: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - web/icons/
