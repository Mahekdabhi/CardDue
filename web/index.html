<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="CardDue is a premium personal credit card bill reminder app. Track billing cycles, due dates, outstanding amounts, and payment history completely offline.">
  <meta name="keywords" content="credit card, bill reminder, personal finance, card due, offline budget, calendar reminders">
  <meta name="author" content="CardDue Team">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CardDue">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>CardDue - Premium Credit Card Bill Reminder</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="background-color: #0A0E17;">
  <!-- Loading spinner placeholder to show before Flutter loads -->
  <div id="loading" style="display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #FFFFFF; background-color: #0A0E17;">
    <div style="font-size: 28px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 24px;">CardDue</div>
    <div class="spinner" style="width: 40px; height: 40px; border: 3px solid rgba(255, 255, 255, 0.1); border-radius: 50%; border-top-color: #3b82f6; animation: spin 1s ease-in-out infinite;"></div>
    <style>
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </div>

  <script>
    window.addEventListener('load', function(ev) {
      // Remove loading indicator when bootstrap finishes loading
      var loading = document.getElementById('loading');
      if (loading) {
        // Flutter bootstrap will load in body
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
